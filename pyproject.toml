[project]
name = "beancount-sparkasse"
version = "0.1.0"
description = "Beancount v3 importers for Sparkasse CSV exports"
readme = "README.md"
authors = [{ name = "Henri Sota", email = "sotahenry@gmail.com" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "beancount>=3",
  "beangulp>=0.2",
]
keywords = ["beancount", "beangulp", "sparkasse"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Repository = "https://github.com/henrisota/beancount-sparkasse"

[dependency-groups]
dev = [
  "prek>=0.5.3",
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.84",
  "zizmor>=1.30.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["B", "C4", "E", "I", "PL", "PT", "RUF", "SIM", "UP", "W"]
