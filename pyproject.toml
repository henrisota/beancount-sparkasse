[project]
name = "beancount-sparkasse"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "beancount>=3",
  "beangulp>=0.2",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.84",
  "zizmor>=1.30.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
